# Cloudflare Worker ayarları. Sirləri (GEMINI_KEY, TG_TOKEN, ACCESS_CODE) buraya YAZMAYIN —
# Cloudflare → Workers → nuanza → Settings → Variables and Secrets bölməsində əlavə edin
# və ya: npx wrangler secret put GEMINI_KEY
name = "nuanza"
main = "dist/worker.js"
compatibility_date = "2026-10-01"

[build]
command = "node build.mjs"
